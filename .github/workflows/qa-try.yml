name: Orun QA try

# Try a scenario: started by the QA worker the moment someone asks a question
# (workflow_dispatch with the try's id), or by hand. The runner claims queued
# tries and has Claude work through each on stage in a real browser, then posts
# the answer, the steps it took, the API calls and a recording. The scheduled
# Orun QA run also answers any tries still waiting.
on:
  workflow_dispatch:
    inputs:
      try_id:
        description: "The try that started this (any queued try is answered)"
        required: false
        type: string

# Tries are answered one job at a time; a newer dispatch queues behind a running one.
concurrency:
  group: qa-try
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@saas/qa-runner..."
      - run: pnpm --filter @saas/qa-runner exec playwright install --with-deps chromium
      - name: Answer the waiting tries
        run: pnpm --filter @saas/qa-runner start
        env:
          QA_MODE: try
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
