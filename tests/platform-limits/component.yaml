apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: platform-limits-tests
  description: Structural guards on the platform contracts the fleet deploys under — Cloudflare account limits and secret scoping
spec:
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture }
      - { path: docs/runbook.md, role: runbook }
  type: turbo-package
  lifecycle: production
  owner: platform
  domain: starter-tests
  path: tests/platform-limits
  subscribe:
    environments:
      - name: dev
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    preBuildCommand: pnpm exec turbo run test --filter=./
  labels:
    team: platform
    layer: test
