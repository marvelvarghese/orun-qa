apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: notifications-worker
  description: Cloudflare Worker for the Notifications bounded context
spec:
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture }
      - { path: docs/runbook.md, role: runbook }
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  domain: starter-runtime
  path: apps/notifications-worker
  dependsOn:
    - component: events-worker
    - component: db-migrate
    # Shared workspace packages this component BUNDLES. Declared so a change
    # to one marks this component changed and redeploys it — without the
    # edge, `orun plan --changed` keys on `path:` alone and a worker can run
    # a months-old copy of a package that has since changed underneath it.
    - component: contracts
    - component: db
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        # wire-live (deploy profile) is the only reader, and dev never
        # deploys — scoping keeps dev jobs from requiring stage+prod
        # credentials they can never use. See specs/profiles/free-tier.md.
        secretEnv:
          WIRING_CLOUDFLARE_HYPERDRIVE_STAGE: "secret://ws_AHTMNGG1/orun-qa/stage/WIRING_CLOUDFLARE_HYPERDRIVE"
          WIRING_CLOUDFLARE_HYPERDRIVE_PROD: "secret://ws_AHTMNGG1/orun-qa/prod/WIRING_CLOUDFLARE_HYPERDRIVE"
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        # wire-live (deploy profile) is the only reader, and dev never
        # deploys — scoping keeps dev jobs from requiring stage+prod
        # credentials they can never use. See specs/profiles/free-tier.md.
        secretEnv:
          WIRING_CLOUDFLARE_HYPERDRIVE_STAGE: "secret://ws_AHTMNGG1/orun-qa/stage/WIRING_CLOUDFLARE_HYPERDRIVE"
          WIRING_CLOUDFLARE_HYPERDRIVE_PROD: "secret://ws_AHTMNGG1/orun-qa/prod/WIRING_CLOUDFLARE_HYPERDRIVE"
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    # BF6b: deploy-time wiring — wrangler.jsonc is rendered, never committed.
    # Verify lanes render from wiring.fixture.json (offline); deploy lanes
    # resolve real IDs from the Secrets Manager wiring manifest (BF5).
    orgName: sourceplane
    owner: sourceplane
    repo: orun-qa

    turboFilter: "@saas/notifications-worker"
    wranglerConfig: wrangler.jsonc
    wranglerTemplate: wrangler.template.jsonc
    wiringComponents: "cloudflare-hyperdrive"
    wiringEnvs: "stage,prod"
    wiringFixture: wiring.fixture.json
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/notifications-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/notifications-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    preDeployCommand: "echo 'No pre-deploy step configured.'"
    migrationCommand: "echo 'No migrations configured.'"
    smokeCommand: "echo 'Internal-only worker; no public smoke endpoint.'"
  labels:
    team: platform
    layer: runtime
    surface: notifications
    runtime: cloudflare
# ci: cycle-break pass 1 — deploy cluster with feedback edges stripped (20260622T135810Z)
