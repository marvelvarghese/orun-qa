apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: billing-worker
  description: Cloudflare Worker for the Billing API surface (private, service-binding only)
spec:
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture }
      - { path: docs/runbook.md, role: runbook }
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  domain: starter-runtime
  path: apps/billing-worker
  dependsOn:
    - component: policy-worker
    # Shared workspace packages this component BUNDLES. Declared so a change
    # to one marks this component changed and redeploys it — without the
    # edge, `orun plan --changed` keys on `path:` alone and a worker can run
    # a months-old copy of a package that has since changed underneath it.
    - component: contracts
    - component: db
  # Runtime secrets, wire-now-seed-later: best-effort references —
  # an unseeded key is skipped at resolve (and by secrets-live), so
  # this block is inert until the value is stored in orun secrets.
  optionalSecretEnv:
    POLAR_ACCESS_TOKEN: "secret://ws_AHTMNGG1/orun-qa/{{ .environment }}/POLAR_ACCESS_TOKEN"
    POLAR_WEBHOOK_SECRET: "secret://ws_AHTMNGG1/orun-qa/{{ .environment }}/POLAR_WEBHOOK_SECRET"

  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        # wire-live (deploy profile) is the only reader, and dev never
        # deploys — scoping keeps dev jobs from requiring stage+prod
        # credentials they can never use. See specs/profiles/free-tier.md.
        secretEnv:
          WIRING_CLOUDFLARE_HYPERDRIVE_STAGE: "secret://ws_AHTMNGG1/orun-qa/stage/WIRING_CLOUDFLARE_HYPERDRIVE"
          WIRING_CLOUDFLARE_HYPERDRIVE_PROD: "secret://ws_AHTMNGG1/orun-qa/prod/WIRING_CLOUDFLARE_HYPERDRIVE"
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        # wire-live (deploy profile) is the only reader, and dev never
        # deploys — scoping keeps dev jobs from requiring stage+prod
        # credentials they can never use. See specs/profiles/free-tier.md.
        secretEnv:
          WIRING_CLOUDFLARE_HYPERDRIVE_STAGE: "secret://ws_AHTMNGG1/orun-qa/stage/WIRING_CLOUDFLARE_HYPERDRIVE"
          WIRING_CLOUDFLARE_HYPERDRIVE_PROD: "secret://ws_AHTMNGG1/orun-qa/prod/WIRING_CLOUDFLARE_HYPERDRIVE"
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    # BF6b: deploy-time wiring — wrangler.jsonc is rendered, never committed.
    # Verify lanes render from wiring.fixture.json (offline); deploy lanes
    # resolve real IDs from the Secrets Manager wiring manifest (BF5).
    orgName: sourceplane
    owner: sourceplane
    repo: orun-qa

    # Runtime worker secrets, pushed by the secrets-live step from the
    # values orun resolves for the optionalSecretEnv references below.
    runtimeSecrets: "POLAR_ACCESS_TOKEN,POLAR_WEBHOOK_SECRET"
    turboFilter: "@saas/billing-worker"
    wranglerConfig: wrangler.jsonc
    wranglerTemplate: wrangler.template.jsonc
    wiringComponents: "cloudflare-hyperdrive"
    wiringEnvs: "stage,prod"
    wiringFixture: wiring.fixture.json
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/billing-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/billing-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    preDeployCommand: "echo 'No pre-deploy step configured.'"
    migrationCommand: "echo 'No migrations configured.'"
    smokeCommand: "echo 'No smoke test configured.'"
  labels:
    team: platform
    layer: runtime
    surface: billing
    runtime: cloudflare
# ci: re-trigger deploy (batch A — runner-starvation recovery 20260622T115650Z)
