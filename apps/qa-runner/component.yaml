apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: qa-runner
  description: "Orun QA's headless runner — Playwright with rrweb DOM recording, run from GitHub Actions against stage"
spec:
  type: turbo-package
  lifecycle: production
  owner: platform
  domain: starter-tests
  path: apps/qa-runner
  dependsOn:
    - component: contracts
    - component: sdk
  subscribe:
    environments:
      - name: dev
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    preBuildCommand: pnpm exec turbo run test --filter=./
  labels:
    team: platform
    layer: test
