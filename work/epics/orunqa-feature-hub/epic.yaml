# Orun QA — the feature hub (QA). Declaration per the software-factory
# template. metadata.key QA reserves QA-1, QA-2, … for this epic only.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: orunqa-feature-hub
  key: QA
spec:
  title: "Orun QA — every feature, shown working"
  summary: "A product hub for PMs, sharing the Orunbase workspace: every feature with a recorded demo that proves it works today, the scenarios and API checks behind it, how features depend on each other, bugs routed to Linear or Jira, and a release review the PM signs before production. The same feature map is served to coding agents over MCP. Orun QA tests itself: its own features live in its own hub, verified by its own scenarios, and its own releases pass its own review."
  state: backlog
  milestones:
    - name: "QA0 — the spec"
      exitCriteria:
        - "the doc set is on main and pushed"
      tasks: [QA-1]
    - name: "QA1 — the feature map"
      exitCriteria:
        - "a workspace member opens the hub and sees every feature with its area, health and owner"
        - "the dependency map shows what each feature relies on and what breaks with it"
        - "Orun QA's own hub lists Orun QA's own features, mapped the same way"
      tasks: [QA-2, QA-3, QA-4, QA-5, QA-6, QA-7]
    - name: "QA2 — scenarios that run and record"
      exitCriteria:
        - "a scenario runs on stage in a real browser and its recording plays on the feature card"
        - "All tests lists every scenario and expands to the API calls it checked"
        - "Try a scenario answers a plain question with a recording"
        - "every Orun QA feature shipped so far is verified by its own scenarios on its own stage"
      tasks: []
    - name: "QA3 — bugs, trackers and developer verification"
      exitCriteria:
        - "a stage failure becomes a Linear or Jira issue with the recording, assigned to the last author"
        - "an issue marked fixed in the tracker re-runs its scenarios and closes on green"
        - "a pull request gets an impact note and a developer can verify the affected scenarios on their branch"
        - "a failure in Orun QA's own stage run files a bug against Orun QA in the same way"
      tasks: []
    - name: "QA4 — planning and the release sign-off"
      exitCriteria:
        - "a PM plans scenarios from typed text or a Linear or Jira issue and sends them to QA"
        - "a release cannot reach production until the PM approves every change in the review"
        - "Orun QA's own production promotion is gated by its own release review"
      tasks: []
    - name: "QA5 — the agent, MCP and the public page"
      exitCriteria:
        - "a coding agent calls the impact tool over MCP before it edits"
        - "the PM asks the agent a question in chat and gets an answer with its sources"
        - "a visitor browses the public feature tour without signing in"
        - "Orun QA's own public tour shows Orun QA, recorded by itself"
      tasks: []
    - name: "QA6 — the Orunbase integration"
      exitCriteria:
        - "a user signs in with Orunbase and connects an Orunbase workspace to a hub"
        - "a hub seeds its features from the connected workspace's catalog"
        - "the connected workspace's production promotion waits on the hub's release review"
      tasks: []
